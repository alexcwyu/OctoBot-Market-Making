[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octobot-market-making"
version = "2.1.1"
description = "Cryptocurrencies market making bot"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.13"
authors = [
    { name = "Drakkar-Software", email = "contact@drakkar.software" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "octobot[full]==2.1.1",
]

[project.scripts]
octobot_market_making = "octobot_market_making.cli:main"

[project.urls]
Homepage = "https://github.com/Drakkar-Software/OctoBot-Market-Making"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/octobot_market_making"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["octobot_market_making"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
